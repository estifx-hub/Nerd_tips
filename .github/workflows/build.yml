name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
      - name: Arrange files
        run: mkdir -p lib && mv main.dart lib/
      - name: Create Android project
        run: |
          flutter create --org com.nerdtips --project-name nerd_tips --platforms=android tmp
          cp -r tmp/android ./android
          rm -rf tmp
          cp AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nerd-tips-apk
          path: build/app/outputs/flutter-apk/app-release.apk
